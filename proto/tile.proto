syntax = "proto3";

package stt;

// Main tile message containing all feature data for a spatiotemporal tile
message Tile {
  // Format version for backward compatibility
  // Version 1: Original format with absolute WGS84 coordinates
  // Version 2: MVT-style quantized coordinates + columnar properties
  uint32 version = 1;
  
  // Temporal bounds of this tile (Unix timestamp in milliseconds)
  uint64 time_start = 2;
  uint64 time_end = 3;
  
  // Feature layers (e.g., "roads", "buildings", "points")
  repeated Layer layers = 4;
  
  // Reserved field numbers for removed fields (interpolation=5, temporal_resolution=6)
  reserved 5, 6;
}

// A layer represents a collection of features with the same schema
message Layer {
  // Layer name
  string name = 1;
  
  // Coordinate extent (default 4096, used for quantized coordinates)
  uint32 extent = 2;
  
  // === Version 1 format: Feature-based (original) ===
  repeated Feature features = 3;
  
  // === Version 2 format: Columnar layout (new) ===
  // Use this for better GPU performance
  ColumnarFeatures columnar = 4;
}

// Individual feature with geometry and properties (Version 1 format)
message Feature {
  // Unique feature identifier
  uint64 id = 1;
  
  // Geometry type
  enum GeomType {
    POINT = 0;
    LINESTRING = 1;
    POLYGON = 2;
  }
  GeomType type = 2;
  
  // Absolute WGS84 coordinates for this feature (Version 1)
  // Points contain a single position, lines/polygons contain multiple positions
  repeated Position positions = 3;
  
  // Properties stored inline for simplicity
  map<string, Value> properties = 4;
  
  // Optional: temporal validity range for this feature
  uint64 valid_from = 5;
  uint64 valid_to = 6;
  
  // === Version 2 additions ===
  // Quantized tile-relative coordinates (when version >= 2)
  // Uses zigzag + delta encoding for efficiency
  repeated sint32 geometry = 7 [packed = true];
}

// Geographic position (Version 1 format - absolute WGS84)
message Position {
  double lon = 1;
  double lat = 2;
}

// Property value (can be string, number, or boolean)
message Value {
  oneof value_type {
    string string_value = 1;
    double double_value = 2;
    float float_value = 3;
    int64 int_value = 4;
    uint64 uint_value = 5;
    sint64 sint_value = 6;
    bool bool_value = 7;
  }
}

// === Version 2: Columnar feature layout for GPU-optimized rendering ===
message ColumnarFeatures {
  // Number of features in this layer
  uint32 feature_count = 1;
  
  // Geometry type for all features in this layer
  Feature.GeomType geometry_type = 2;
  
  // Feature IDs as flat array
  repeated uint64 feature_ids = 3 [packed = true];
  
  // Quantized geometry data
  // For points: [x0, y0, x1, y1, ...] (2 values per feature)
  // For lines/polygons: use geometry_offsets to index
  repeated sint32 geometry = 4 [packed = true];
  
  // For non-point geometries: offset into geometry array for each feature
  // Length = feature_count + 1 (last value is total geometry count)
  repeated uint32 geometry_offsets = 5 [packed = true];
  
  // Temporal data
  // Start times relative to tile time_start (delta encoded)
  repeated sint64 start_times = 6 [packed = true];
  // End times relative to start_times (delta encoded)
  repeated sint64 end_times = 7 [packed = true];
  
  // Numeric properties (columnar layout)
  repeated NumericColumn numeric_properties = 8;
  
  // Categorical properties (dictionary encoded)
  repeated CategoricalColumn categorical_properties = 9;
}

// A column of numeric property values
message NumericColumn {
  string name = 1;
  // Values as float32 (good balance of precision and size)
  repeated float values = 2 [packed = true];
  // Optional: original values as float64 for high-precision needs
  repeated double values_f64 = 3 [packed = true];
}

// A column of categorical (string) property values
message CategoricalColumn {
  string name = 1;
  // Dictionary of unique values
  repeated string categories = 2;
  // Index into categories for each feature (0-255 range)
  bytes indices = 3;
}
