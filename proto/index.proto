syntax = "proto3";

package stt;

// Main index structure for efficient spatiotemporal queries
message Index {
  // All tiles in the archive (sorted by Hilbert curve)
  repeated TileEntry tiles = 1;
  
  // Spatial index for fast lookup
  SpatialIndex spatial = 2;
  
  // Temporal index for fast time-range queries
  TemporalIndex temporal = 3;
}

// Metadata for a single tile
message TileEntry {
  // Tile coordinates
  uint32 zoom = 1;
  uint32 x = 2;
  uint32 y = 3;
  
  // Temporal bounds (Unix timestamp in milliseconds)
  uint64 time_start = 4;
  uint64 time_end = 5;
  
  // Location in archive file
  uint64 offset = 6;      // Byte offset from start of file
  uint32 length = 7;      // Compressed size in bytes
  
  // Statistics for optimization
  uint32 feature_count = 8;
  
  // Compression method
  enum Compression {
    NONE = 0;
    GZIP = 1;
    BROTLI = 2;
  }
  Compression compression = 9;
  
  // Original (uncompressed) size
  uint32 uncompressed_size = 10;
}

// Spatial index using Hilbert curve for spatial locality
message SpatialIndex {
  // Mapping from Hilbert curve position to tile index
  // Allows O(log n) spatial lookups
  // Format: sorted array of (hilbert_id, tile_index) pairs
  repeated uint64 hilbert_ids = 1 [packed = true];
  repeated uint32 tile_indices = 2 [packed = true];
  
  // Zoom level boundaries (offset into hilbert_ids)
  // zoom_offsets[z] = first index for zoom level z
  repeated uint32 zoom_offsets = 3 [packed = true];
}

// Temporal index using B-tree style structure
message TemporalIndex {
  // Sorted array of unique timestamps in the archive
  repeated uint64 timestamps = 1 [packed = true];
  
  // For each timestamp, list of tiles that overlap that time
  // Format: offset into tile_refs array
  repeated uint32 tile_ref_offsets = 2 [packed = true];
  
  // Flattened array of tile indices
  // Use tile_ref_offsets to slice into this array
  repeated uint32 tile_refs = 3 [packed = true];
}

