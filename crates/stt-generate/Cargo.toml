[package]
name = "stt-generate"
description = "Unified CLI for generating spatiotemporal tile datasets"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stt-generate"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
stt-core = { path = "../stt-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
geojson.workspace = true
geo.workspace = true
geo-types.workspace = true
csv.workspace = true
chrono.workspace = true
rayon.workspace = true
clap.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
flate2.workspace = true

# Additional dependencies
reqwest = { version = "0.11", features = ["blocking", "json"] }
sgp4 = "2.3"
zip = "0.6"
rand = "0.8"
parquet = { version = "54", default-features = false, features = ["arrow", "flate2", "snap", "zstd"] }
arrow = { version = "54", default-features = false, features = ["chrono-tz"] }
urlencoding = "2.1"

# OSM editing-history generator (`osm-edits` subcommand)
# osmpbf reads full-history `.osh.pbf` extracts (exposes per-version
# version()/visible()/milli_timestamp(), so we can pick first-version "creation"
# events). bzip2 + quick-xml stream the public `changesets-latest.osm.bz2` dump.
osmpbf = "0.3"
bzip2 = "0.4"
quick-xml = "0.36"

# NEXRAD Level II storm-radar generator (`storms` subcommand).
# nexrad-data: anonymous AWS S3 archive download + file I/O (default features
#   `aws` + `nexrad-model` bring the reqwest S3 client and Scan/Sweep/Radial model).
# nexrad-decode: WSR-88D ICD binary decode. nexrad-model: the radar data model.
nexrad-data = "1.0.0-rc.7"
nexrad-decode = "1.0.0-rc.3"
nexrad-model = "1.0.0-rc.2"
# Filled reflectivity contour bands via marching-squares isobands (geo-types 0.7).
contour = "0.13"
# Scoped async runtime, used only to block_on the async nexrad-data S3 calls;
# the rest of this crate stays synchronous.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.10"


