[package]
name = "stt-build"
description = "CLI tool for building spatiotemporal tile archives"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "stt_build"
path = "src/lib.rs"

[[bin]]
name = "stt-build"
path = "src/main.rs"

[dependencies]
stt-core = { path = "../stt-core" }
stt-optimize = { path = "../stt-optimize" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
geojson.workspace = true
geo.workspace = true
geo-types.workspace = true
geozero.workspace = true
rayon.workspace = true
crossbeam.workspace = true
clap.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

# H3 hexagonal aggregation cells for the summary tier.
h3o = "0.7"

# Optional advanced projection support (requires system libproj)
proj = { version = "0.27", optional = true }

# GeoParquet/GeoArrow support
geoarrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }

[features]
default = ["geoparquet"]
# Enable advanced projection support (requires system libproj)
projection = ["stt-core/projection", "proj"]
# Enable GeoParquet/GeoArrow support for high-performance I/O  
geoparquet = ["geoarrow", "parquet", "arrow", "arrow-schema", "arrow-array"]

[dev-dependencies]
criterion.workspace = true
tempfile = "3.10"
libc = "0.2"

