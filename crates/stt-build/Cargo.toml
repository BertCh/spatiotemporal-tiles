[package]
name = "stt-build"
description = "CLI tool for building spatiotemporal tile archives"
readme = "README.md"
keywords = ["tiles", "spatiotemporal", "geospatial", "cli", "gis"]
categories = ["science::geo", "command-line-utilities"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
exclude = ["/examples", "/tests"]

[lib]
name = "stt_build"
path = "src/lib.rs"

[dependencies]
stt-core = { path = "../stt-core", version = "0.1.0" }
stt-optimize = { path = "../stt-optimize", version = "0.1.0" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
geojson.workspace = true
geo.workspace = true
geozero.workspace = true
rayon.workspace = true
clap.workspace = true
tracing.workspace = true
chrono.workspace = true

# Temp single-file archive staging for the --streaming-arrow -> packed transcode.
tempfile = "3.10"

# H3 hexagonal aggregation cells for the summary tier.
h3o = "0.7"

# Optional advanced projection support (requires system libproj)
proj = { version = "0.27", optional = true }

# GeoParquet/GeoArrow support. Mandatory: the tiler's Arrow IPC encode path
# uses arrow/parquet unconditionally, so a geoparquet-less stt-build cannot
# exist — the `geoparquet` feature below is a no-op kept for CLI compat.
geoarrow = { workspace = true }
parquet = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }

# PostGIS input source (feature `postgres`). Sync driver — keeps stt-build
# tokio-free. `with-chrono-0_4` decodes timestamp columns; `with-serde_json-1`
# decodes json/jsonb property columns.
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"], optional = true }

# DuckDB input source (feature `duckdb`). `bundled` statically links libduckdb
# so there's no system-lib requirement (mirrors the self-contained `postgres`
# crate); `chrono` decodes DATE/TIMESTAMP/TIMESTAMPTZ columns. The DuckDB
# *spatial* extension (ST_AsWKB/ST_Transform) is a separate downloadable
# extension loaded at runtime via `INSTALL spatial; LOAD spatial;` — it is NOT
# part of the bundle. The crate vendors its own (newer) Arrow internally; we use
# only the row/`ValueRef` API, so no Arrow types cross the boundary and there's
# no clash with stt-build's own Arrow version.
duckdb = { version = "1", features = ["bundled", "chrono"], optional = true }

[features]
default = ["geoparquet"]
# Enable advanced projection support (requires system libproj)
projection = ["stt-core/projection", "proj"]
# No-op back-compat alias: GeoParquet/GeoArrow support is always compiled in
# (the encode path needs arrow/parquet unconditionally).
geoparquet = []
# Enable the PostGIS input source (`--postgres`/`--table`/`--sql`).
postgres = ["dep:postgres"]
# Enable the DuckDB input source (`--duckdb`/`--table`/`--sql`).
duckdb = ["dep:duckdb"]

[dev-dependencies]
criterion.workspace = true
tempfile = "3.10"
libc = "0.2"

