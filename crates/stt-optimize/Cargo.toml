[package]
name = "stt-optimize"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Spatiotemporal dataset analyzer and optimizer for STT file generation"
readme = "README.md"
keywords = ["tiles", "spatiotemporal", "geospatial", "optimization", "cli"]
categories = ["science::geo", "command-line-utilities"]

[lib]
name = "stt_optimize"
path = "src/lib.rs"

[[bin]]
name = "stt-optimize"
path = "src/main.rs"

[dependencies]
# Workspace crate
stt-core = { path = "../stt-core", version = "0.1.0" }

# Core dependencies
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# GeoParquet/Arrow
parquet.workspace = true
arrow.workspace = true

# CLI
clap.workspace = true
indicatif.workspace = true

# Time
chrono.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true


