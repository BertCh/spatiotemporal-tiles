[package]
name = "stt-optimize"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Spatiotemporal dataset analyzer and optimizer for STT file generation"
readme = "README.md"
keywords = ["tiles", "spatiotemporal", "geospatial", "optimization", "cli"]
categories = ["science::geo", "command-line-utilities"]

[lib]
name = "stt_optimize"
path = "src/lib.rs"

[dependencies]
# Workspace crate
stt-core = { path = "../stt-core", version = "0.4.0" }

# Core dependencies
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# GeoParquet/Arrow
parquet.workspace = true
arrow.workspace = true

# Geometry parsing (WKB via geozero, shared with stt-build)
geozero.workspace = true
geo.workspace = true
geo-types.workspace = true

# Progress reporting (loader/spatial analysis)
indicatif.workspace = true

# Time
chrono.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
tempfile = "3.10"


