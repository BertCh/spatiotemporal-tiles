[package]
name = "stt-serve"
description = "Dynamic STT tile server — generates spatiotemporal tiles on the fly from a live PostGIS table or a DuckDB database (the ST_AsMVT analog for STT)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stt-serve"
path = "src/main.rs"

[dependencies]
# The tile encoder + the PostGIS/DuckDB row decoders live in stt-build; we need
# both backend features for the decode helpers and `encode_single_tile`.
stt-build = { path = "../stt-build", features = ["postgres", "duckdb"] }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true

# HTTP server (async) + runtime.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# Postgres backend: async client + connection pool. `tokio_postgres::Row` is
# exactly the `postgres::Row` that stt-build's `postgres_input` decodes (the
# sync `postgres` crate re-exports it), so `decode_rows` accepts these rows
# directly. The async client avoids nesting a sync runtime inside tokio; the
# CPU-bound tile encode runs on `spawn_blocking`.
tokio-postgres = "0.7"
deadpool-postgres = "0.14"

# DuckDB backend: embedded engine + r2d2 pool (DuckDB `Connection` is Send but
# !Sync — one connection per worker). `bundled` statically links libduckdb
# (already built once for stt-build). All DuckDB work — pool checkout, query,
# decode, encode — is blocking, so it runs on `spawn_blocking`.
duckdb = { version = "1", features = ["bundled", "r2d2"] }
r2d2 = "0.8"
