[package]
name = "spatiotemporal-tiles"
description = "SpatioTemporal Tiles (STT): animated space-time tile archives — umbrella crate re-exporting the stt-* libraries and shipping the stt-build/stt-optimize/stt-validate/stt-bundle/stt-serve CLIs"
readme = "README.md"
keywords = ["tiles", "spatiotemporal", "geospatial", "arrow", "gis"]
categories = ["science::geo", "encoding", "command-line-utilities"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "spatiotemporal_tiles"
path = "src/lib.rs"

# The CLI binaries live here (feature-gated) so `cargo install
# spatiotemporal-tiles --features cli` is the one install command; the
# binary names stay `stt-*` to match the CLI reference docs.
[[bin]]
name = "stt-build"
path = "src/bin/stt-build.rs"
required-features = ["build-cli"]

[[bin]]
name = "stt-optimize"
path = "src/bin/stt-optimize.rs"
required-features = ["optimize-cli"]

[[bin]]
name = "stt-validate"
path = "src/bin/stt-validate/main.rs"
required-features = ["validate-cli"]

[[bin]]
name = "stt-bundle"
path = "src/bin/stt-bundle.rs"
required-features = ["bundle-cli"]

[[bin]]
name = "stt-serve"
path = "src/bin/stt-serve.rs"
required-features = ["serve-core"]

[dependencies]
# The reader/format core is always present (the facade is useless without it).
stt-core = { path = "../stt-core", version = "0.5.0" }
stt-build = { path = "../stt-build", version = "0.5.0", optional = true }
stt-optimize = { path = "../stt-optimize", version = "0.5.0", optional = true }

# CLI support (feature `cli-core`).
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# stt-validate (feature `validate-cli`): Arrow IPC decode checks, plus the
# same H3 crate/version stt-build mints summary cells with — the summary
# cell-id validity check must agree with the builder bit-for-bit.
arrow = { workspace = true, optional = true }
h3o = { version = "0.7", optional = true }

# stt-serve (feature `serve`): HTTP server + runtime.
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
], optional = true }

# stt-serve Postgres backend (feature `serve-postgres`): async client +
# pool. `tokio_postgres::Row` is exactly the `postgres::Row` stt-build's
# postgres_input decodes, so `decode_rows` accepts these rows directly.
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
# stt-serve opt-in Postgres TLS (feature `serve-postgres-tls`): only compiled
# when the feature is enabled; the default `serve-postgres` build stays NoTls.
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }

# stt-serve DuckDB backend (feature `serve-duckdb`): embedded engine + r2d2
# pool (DuckDB `Connection` is Send but !Sync — one connection per worker).
duckdb = { version = "1", features = ["bundled", "r2d2"], optional = true }
r2d2 = { version = "0.8", optional = true }

[features]
# A bare `cargo install spatiotemporal-tiles` installs all five CLIs with the
# light pure-Rust dependency set (stt-serve gets the PostGIS backend; the
# bundled-DuckDB backend is a heavy C++ build, opt in via `serve-duckdb` or
# `cli`). Library consumers should depend with `default-features = false`.
default = [
  "build-cli",
  "optimize-cli",
  "validate-cli",
  "bundle-cli",
  "serve-postgres",
]
# Library re-exports: `spatiotemporal_tiles::build` / `::optimize`.
build = ["dep:stt-build"]
optimize = ["dep:stt-optimize"]
# Database input sources for the build library/CLI.
postgres = ["build", "stt-build/postgres"]
duckdb = ["build", "stt-build/duckdb"]

# --- CLI binaries -----------------------------------------------------------
# Shared bin plumbing; not useful on its own.
cli-core = [
  "dep:anyhow",
  "dep:serde",
  "dep:serde_json",
  "dep:clap",
  "dep:indicatif",
  "dep:tracing",
  "dep:tracing-subscriber",
]
build-cli = ["build", "cli-core"]
optimize-cli = ["optimize", "cli-core"]
validate-cli = ["cli-core", "dep:arrow", "dep:h3o"]
# stt-bundle (single-file .sttb interchange): pure stt-core + CLI plumbing.
bundle-cli = ["cli-core"]
# stt-serve plumbing (HTTP server + runtime), backend-less. Internal: enabling
# it without a backend is a compile error (see the compile_error! guard in
# src/bin/stt-serve.rs) — enable `serve` or a `serve-*` backend instead.
serve-core = ["build", "cli-core", "dep:axum", "dep:tokio"]
serve-postgres = [
  "serve-core",
  "postgres",
  "dep:tokio-postgres",
  "dep:deadpool-postgres",
]
# Opt-in TLS for the stt-serve Postgres backend (sslmode=require). Pulls in a
# native-tls connector; never a default (keeps the light dep set + local-dev
# NoTls path intact).
serve-postgres-tls = [
  "serve-postgres",
  "dep:postgres-native-tls",
  "dep:native-tls",
]
serve-duckdb = ["serve-core", "duckdb", "dep:duckdb", "dep:r2d2"]
# The full stt-serve binary as documented: both backends.
serve = ["serve-postgres", "serve-duckdb"]
# Everything: all five binaries, both serve backends.
cli = ["build-cli", "optimize-cli", "validate-cli", "bundle-cli", "serve"]

[dev-dependencies]
tempfile = "3.10"
# `tests/build_cli_reproducible.rs` synthesises the GeoParquet input it feeds
# to the `stt-build` BINARY twice (there is no committed .parquet fixture
# anywhere in the repo — see that file's header). Both crates are already in
# the resolved graph at the workspace-pinned 59 (stt-core pulls `arrow`,
# stt-build pulls `parquet`), so this adds no new third-party code — only the
# ability to WRITE the fixture from this crate's test targets.
arrow = { workspace = true }
parquet = { workspace = true }

# Prebuilt binaries (cargo-dist): all four CLIs, both stt-serve backends.
[package.metadata.dist]
features = ["cli"]

[package.metadata.docs.rs]
# Library docs only — the defaults exist for `cargo install`, not for docs.
no-default-features = true
features = ["build", "optimize", "postgres", "duckdb"]
