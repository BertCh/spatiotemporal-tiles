[package]
name = "stt-validate"
description = "Validate STT archives: header, content hashes, Arrow IPC decode."
readme = "README.md"
keywords = ["tiles", "spatiotemporal", "geospatial", "validation", "cli"]
categories = ["science::geo", "command-line-utilities"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stt-validate"
path = "src/main.rs"

[dependencies]
stt-core = { path = "../stt-core", version = "0.1.0" }
arrow = { workspace = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
indicatif.workspace = true

[dev-dependencies]
tempfile = "3.10"
