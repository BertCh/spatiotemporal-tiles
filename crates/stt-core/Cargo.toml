[package]
name = "stt-core"
description = "Core library for spatiotemporal tile format"
readme = "README.md"
keywords = ["tiles", "spatiotemporal", "geospatial", "arrow", "gis"]
categories = ["science::geo", "encoding"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
geo.workspace = true
geo-types.workspace = true
earcutr.workspace = true
zstd = "0.13"
hilbert_2d.workspace = true
byteorder.workspace = true
memmap2.workspace = true
tracing.workspace = true
chrono.workspace = true
blake3.workspace = true
crc32c.workspace = true
rayon.workspace = true

# Apache Arrow: tile payloads are Arrow IPC, the archive index is an Arrow table
arrow = { workspace = true }

# Optional advanced projection support (requires system libproj)
proj = { version = "0.27", optional = true }

[features]
# Enable advanced projection support with proj
# Requires system libproj to be installed
projection = ["proj"]

[dev-dependencies]
criterion.workspace = true
tempfile = "3.10"

[[bench]]
name = "encoding"
harness = false

