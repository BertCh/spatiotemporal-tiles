# `stt-generate` is its OWN workspace, deliberately outside the root one.
#
# It is a 20k-line internal generator that is never published, and its deps
# (home → osmpbf, delaunator) carry a far higher MSRV than the four published
# crates need. As a root-workspace member it forced that MSRV onto every
# published crate through the shared `[workspace.package] rust-version`, and it
# dragged its whole dep tree (osmpbf, nexrad-*, tokio, reqwest, …) into every
# `cargo check --workspace`. The only coupling to the rest of the repo is the
# `stt-core` path dependency below plus shelling out to the `stt-build` BINARY,
# so splitting the workspace costs nothing and buys back the root MSRV.
[workspace]
resolver = "2"

[package]
name = "stt-generate"
description = "Unified CLI for generating spatiotemporal tile datasets"
readme = "README.md"
keywords = ["tiles", "spatiotemporal", "geospatial", "datasets", "cli"]
categories = ["science::geo", "command-line-utilities"]
version = "0.5.0"
edition = "2021"
authors = ["Robert Christie"]
license = "MIT"
repository = "https://github.com/BertCh/spatiotemporal-tiles"
homepage = "https://github.com/BertCh/spatiotemporal-tiles"
# Forced by `home` (via osmpbf) and `delaunator`. This is the MSRV that used to
# be the WHOLE workspace's; it now stops here.
rust-version = "1.88"
# Internal demo-dataset generator (RC nexrad deps); never published.
publish = false

[package.metadata.dist]
dist = false

[[bin]]
name = "stt-generate"
path = "src/main.rs"

[dependencies]
# The one library coupling to the rest of the repo (nyc-taxi-points reads a
# built archive back with `PackedReader`). Everything else goes through the
# `stt-build` CLI. Path-only: this crate is never published, and stt-core
# resolves its own inherited fields against the ROOT workspace it still belongs
# to.
stt-core = { path = "../../crates/stt-core" }

# Versions are spelled out rather than inherited: this crate no longer shares
# the root `[workspace.dependencies]` table. Keep them in step with the root
# Cargo.toml so `stt-core` is not built twice with different arrow versions.
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
geojson = { version = "0.24", features = ["geo-types"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1.0"
parquet = { version = "59", default-features = false, features = [
  "arrow",
  "flate2",
  "flate2-rust_backened",
  "snap",
  "zstd",
] }
arrow = { version = "59", default-features = false, features = [
  "chrono-tz",
  "ipc",
] }

# Additional dependencies
reqwest = { version = "0.11", features = ["blocking", "json"] }
# Feed-local → absolute-Unix-ms anchoring for the GTFS generator (`gtfs`
# subcommand): GTFS clock times are offsets on the service date in the agency
# timezone. Already in the tree via arrow's `chrono-tz` feature, so this pins
# no new build cost.
chrono-tz = "0.10"
# 2D Delaunay triangulation for the abstract flow-network proximity graph
# (bixi --flow-graph edge-path bundling). Tiny, pure-Rust, no deps.
delaunator = "1"
sgp4 = "2.3"
zip = "0.6"
rand = "0.8"
urlencoding = "2.1"
# NWM retrospective zarr chunks (`nwm` subcommand) are bare zstd frames —
# decoded directly with the same zstd stt-core already links; no zarr crate.
zstd = "0.13"

# OSM editing-history generator (`osm-edits` subcommand)
# osmpbf reads full-history `.osh.pbf` extracts (exposes per-version
# version()/visible()/milli_timestamp(), so we can pick first-version "creation"
# events). bzip2 + quick-xml stream the public `changesets-latest.osm.bz2` dump.
osmpbf = "0.3"
bzip2 = "0.4"
quick-xml = "0.36"

# NEXRAD Level II storm-radar generator (`storms` subcommand).
# nexrad-data: anonymous AWS S3 archive download + file I/O (default features
#   `aws` + `nexrad-model` bring the reqwest S3 client and Scan/Sweep/Radial model).
# nexrad-decode: WSR-88D ICD binary decode. nexrad-model: the radar data model.
nexrad-data = "1.0.0-rc.7"
nexrad-decode = "1.0.0-rc.3"
nexrad-model = "1.0.0-rc.2"
# Filled reflectivity contour bands via marching-squares isobands (geo-types 0.7).
contour = "0.13"
# Scoped async runtime, used only to block_on the async nexrad-data S3 calls;
# the rest of this crate stays synchronous.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.10"

# Mirrors the root workspace's release profile — this crate builds its own
# binary from its own target dir now, so it does not inherit those settings.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
