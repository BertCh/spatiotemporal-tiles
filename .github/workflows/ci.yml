name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust (cargo test, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features = what `cargo install` users get.
      - name: cargo test --workspace
        run: cargo test --workspace --locked
        env:
          # Same linker OOM the all-features lane documents below: several test
          # binaries link concurrently and ld dies with SIGBUS ("signal 7, core
          # dumped") under full debuginfo on the 7 GB runner. It reached this
          # lane too as the test suite grew. Debuginfo is useless in CI.
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'

  rust-all-features:
    name: Rust (cargo test, all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Everything at once. The features that actually exist and make this
      # lane heavy: the facade `cli` (all five bins, both serve backends),
      # `duckdb` / `serve-duckdb` (the `duckdb` crate's `bundled` feature
      # compiles and statically links libduckdb — a large C++ build),
      # `postgres` / `serve-postgres`, and `serve-postgres-tls` (native-tls).
      # This is a TEST job — the old CI built --all-features but never ran
      # the feature-gated tests.
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features --locked
        env:
          # The all-features link jobs (statically linked bundled DuckDB C++
          # + arrow/parquet + all five CLI binaries, several test binaries
          # linking concurrently) OOM the 7 GB runner's linker under full
          # debuginfo — ld dies with SIGBUS
          # ("signal 7, core dumped"). Debuginfo is useless in CI; dropping
          # it shrinks the link inputs by an order of magnitude.
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'

  rust-lint:
    name: Rust (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain action installs the minimal profile, which ships neither
      # rustfmt nor clippy — without this the steps below fail on a missing
      # component rather than on a real finding.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Baseline drift: rustfmt is the only formatting convention the workspace
      # has, and a hand-formatted patch turns every later diff over the same
      # lines into review noise that hides the real change.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # Correctness-flavoured lints ONLY, and the list is exactly what the
      # workspace satisfies in full: every hit is therefore a fresh regression,
      # never a pre-existing backlog entry. `-D warnings` is not usable here —
      # the workspace still carries dozens of style, complexity and perf
      # warnings, so it would fail on the first run and gate nothing. Widening
      # the list requires first driving that lint's count to zero; plain
      # `cargo clippy --workspace --all-targets` prints the standing backlog.
      # `clippy::float_cmp` is deliberately absent: exact float comparison is
      # intended here (integrality probes, encode/decode roundtrip assertions).
      # Default features, matching the `rust` job — linting the duckdb path
      # costs the bundled libduckdb C++ build, and rust-all-features already
      # compiles it (along with the postgres and TLS paths).
      - name: cargo clippy (curated deny set)
        run: |
          cargo clippy --workspace --all-targets --locked -- \
            -D clippy::correctness \
            -D clippy::suspicious \
            -D clippy::cast_ptr_alignment \
            -D clippy::index_refutable_slice \
            -D clippy::invalid_upcast_comparisons \
            -D clippy::mem_forget \
            -D clippy::debug_assert_with_mut_call \
            -D clippy::path_buf_push_overwrite \
            -D clippy::transmute_ptr_to_ptr \
            -D clippy::undocumented_unsafe_blocks \
            -D clippy::lossy_float_literal \
            -D clippy::dbg_macro \
            -D clippy::todo \
            -D clippy::unimplemented

  rust-feature-lanes:
    name: Rust (feature lanes compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each published feature combination must compile on its own —
      # feature-unification in the workspace jobs would otherwise hide
      # missing cfg gates until a user hits them.
      - name: facade lib only (no features)
        run: cargo check -p spatiotemporal-tiles --no-default-features --locked
      - name: facade bare serve (both backends)
        run: cargo check -p spatiotemporal-tiles --no-default-features --features serve --bins --locked
      - name: facade serve-postgres only
        run: cargo check -p spatiotemporal-tiles --no-default-features --features serve-postgres --bins --locked
      - name: facade serve-duckdb only
        run: cargo check -p spatiotemporal-tiles --no-default-features --features serve-duckdb --bins --locked
      - name: facade full cli
        run: cargo check -p spatiotemporal-tiles --no-default-features --features cli --bins --locked
      - name: stt-build without geoparquet
        run: cargo check -p stt-build --no-default-features --locked

  rust-package:
    name: Rust (cargo package dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Continuously verifies publishability: package excludes, versioned
      # path-deps, and manifest errors fail here instead of at release time.
      # `--exclude stt-generate` is belt-and-braces — the generator moved out
      # to its own workspace at tools/, and cargo only warns about excluding a
      # non-member, so this keeps working if it ever moves back.
      - name: cargo package --workspace
        run: cargo package --workspace --exclude stt-generate --locked

  rust-msrv:
    name: Rust (MSRV check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with [workspace.package] rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # The MSRV is a promise to `cargo install` users, so it covers exactly
      # the crates they can install — naming them beats `--workspace`, which
      # dragged in the unpublished stt-generate (osmpbf/home/delaunator) and
      # let a generator-only dep raise the number users see. Naming packages
      # also keeps this job correct whether stt-generate is still a workspace
      # member or has moved out to tools/.
      - name: cargo check on MSRV (published crates)
        run: cargo check -p stt-core -p stt-build -p stt-optimize -p spatiotemporal-tiles --locked

  rust-duckdb:
    name: Rust (stt-build, duckdb feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `INSTALL spatial` downloads the extension into ~/.duckdb on first use.
      # Cache it so the ignored spatial test below neither re-downloads on
      # every run nor goes red when the extension host has a bad day. Keyed on
      # Cargo.lock — the duckdb crate version is what pins the extension
      # version the download resolves to.
      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: ~/.duckdb
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: duckdb-ext-${{ runner.os }}-
      # Bundled libduckdb is a ~10 min cold compile; rust-cache keeps the
      # warm path fast.
      - name: cargo test -p stt-build --features duckdb
        run: cargo test -p stt-build --features duckdb
      # spatial_roundtrip_smoke is the only test that runs the SQL the server
      # actually emits (ST_Point / ST_AsWKB / ST_MakeEnvelope /
      # ST_Intersects_Extent / ST_Transform). It is #[ignore]d because the
      # first INSTALL needs network, so a plain `cargo test` skips it and that
      # SQL ships unexercised — this step is the whole reason the job is more
      # than a compile check. `--lib` scopes --include-ignored to the lib test
      # binary, keeping the server-gated ignored tests in tests/ out of it.
      - name: duckdb spatial SQL (ignored test)
        run: cargo test -p stt-build --features duckdb --lib -- --include-ignored

  rust-postgres-parity:
    name: Rust (PostGIS source parity)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STT_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/stt_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--test source_parity -- --ignored` runs exactly the #[ignore]d
      # postgres parity tests (they are the only ignored tests in that
      # binary) without sweeping up ignored tests elsewhere.
      - name: postgres source parity
        run: cargo test -p stt-build --features postgres --test source_parity -- --ignored

  python:
    name: Python (data-generation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/data-generation/requirements-ci.txt
      - run: pip install -r scripts/data-generation/requirements-ci.txt
      # The AV palettes are a cross-language contract: the extractors bake them
      # into scene.json and the tiles, and any renderer drawing those archives
      # must paint them identically. This used to be enforced by a test that
      # read av_common.py AND the renderer's datasets.ts — impossible since the
      # repository split. The authority now EXPORTS the contract as
      # docs/spec/av-palettes.json (gated here) and the renderer asserts against
      # that artifact, which also makes it readable by a third party.
      - name: AV palette contract is current
        run: python emit_av_palettes.py --check
        working-directory: scripts/data-generation
      - name: av_common worldbuild + tracks
        run: python test_av_common_world_tracks.py
        working-directory: scripts/data-generation
      - name: av_common LOD home-zoom
        run: python test_lod_home_zoom.py
        working-directory: scripts/data-generation

  gates:
    name: Repository gates (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The golden-pin gate below diffs against a merge-base, which the
          # default depth-1 checkout cannot compute. It fails closed rather
          # than checking nothing, so full history is not optional here.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      # Version gate: `[workspace.package] version` is one hand edit, but every
      # internal path-dependency carries the number too, and cargo refuses to
      # update a lockfile when those lag. Pure fs + TOML, no install needed —
      # run it first so drift fails in seconds.
      - name: cargo workspace versions in sync
        run: node scripts/sync-versions.mjs --check
      - name: project status matches the crates
        run: node scripts/check-project-status.mjs
      - name: documentation links resolve
        run: node scripts/check-doc-links.mjs
      # Doc-drift gate: source comments cite docs/roadmap/*.md by name, and the
      # last roadmap consolidation stranded 39 of them. git grep + existsSync,
      # ~50 ms. Since the split it also counts `poopdeck:`-prefixed citations,
      # so a pointer into the renderer repo is declared rather than silently
      # unchecked.
      - name: roadmap citations resolve
        run: node .github/scripts/check-roadmap-citations.mjs
      # Golden-pin gate: the v2 byte fixtures are the encoder's determinism
      # oracle, and the two times they moved, each move cost a full fleet
      # re-upload (29.3 GiB / 1,324 objects in 2026-07-26). Moving them is a
      # reviewed decision, declared with a `Rebuild-Window: R1` commit trailer;
      # anything else is an encoder bug wearing a re-blessed fixture. Pure git,
      # no install needed.
      - name: golden byte pins only move inside rebuild window R1
        run: node .github/scripts/check-golden-pins.mjs
      # The gate's own tests, in the same block: a gate nobody tests rots into
      # a green light. node:test, no dependencies, well under a second.
      - name: golden-pin gate self-test
        run: node --test .github/scripts/check-golden-pins.test.mjs
      # The generator's clap subcommand set is published as an artifact that
      # @poopdeck.gl/mcp binds its `generate_dataset` enum to. A generator added
      # or removed without regenerating leaves an MCP client offered a dataset
      # `stt-generate` will reject.
      - name: stt-generate dataset inventory is current
        run: node scripts/gen-generate-datasets.mjs --check
      - run: pnpm install --frozen-lockfile
      # Correctness class, not taste: .oxlintrc.json enables the correctness
      # category as errors and nothing else, so a hit is a dead binding, an
      # unreachable branch, or a broken import.
      - run: pnpm lint
      - run: pnpm format:check
