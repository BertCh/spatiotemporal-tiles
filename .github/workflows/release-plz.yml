name: Release-plz (Rust)

on:
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: write
  # OIDC for crates.io Trusted Publishing (configured per-crate on crates.io
  # after the first manual publish; see docs/roadmap/shipping-2026-07.md).
  id-token: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exchanges the workflow's OIDC identity for a short-lived crates.io
      # token — no long-lived CARGO_REGISTRY_TOKEN secret.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - uses: release-plz/action@v0.5
        env:
          # Must be a PAT (or GitHub App token), NOT the default GITHUB_TOKEN:
          # PRs opened with GITHUB_TOKEN don't trigger CI on themselves.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_PAT }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
