[workspace]
members = [
    "crates/stt-core",
    "crates/stt-build",
    "crates/stt-generate",
    "crates/stt-join",
    "crates/stt-tile",
    "crates/stt-analyze",
    "scripts/data-generation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Robert Christie"]
license = "MIT"
repository = "https://github.com/robertchristie/spatiotemporal-tiles"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Geometry processing
geo = "0.28"
geo-types = "0.7"
geojson = { version = "0.24", features = ["geo-types"] }
wkt = "0.10"
geo-traits = "0.2"

# GeoArrow/GeoParquet ecosystem
geoarrow = { version = "0.3", default-features = false }
arrow = { version = "53", default-features = false, features = ["chrono-tz"] }
parquet = { version = "53", default-features = false, features = ["arrow", "flate2", "snap", "zstd"] }
arrow-schema = "53"
arrow-array = "53"

# Data I/O
csv = "1.3"

# Protocol Buffers
prost = "0.12"
prost-types = "0.12"

# Compression
flate2 = "1.0"

# Spatial indexing
hilbert_2d = "1.0"

# Cryptographic hashing
blake3 = "1.5"

# Parallel processing
rayon = "1.10"
crossbeam = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"

# Time/Date
chrono = { version = "0.4", features = ["serde"] }

# I/O optimization
memmap2 = "0.9"
byteorder = "1.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

