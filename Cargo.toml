[workspace]
members = [
    "crates/stt-core",
    "crates/stt-build",
    "crates/stt-generate",
    "crates/stt-optimize",
    "crates/spatiotemporal-tiles",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Robert Christie"]
license = "MIT"
repository = "https://github.com/BertCh/spatiotemporal-tiles"
homepage = "https://github.com/BertCh/spatiotemporal-tiles"
# Empirically verified MSRV (forced by home/osmpbf/delaunator); enforced by the CI msrv job.
rust-version = "1.88"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Geometry processing
geo = "0.28"
geo-types = "0.7"
geojson = { version = "0.24", features = ["geo-types"] }
geo-traits = "0.2"

# Polygon tessellation (pre-baked triangle indices, MLT-style)
earcutr = "0.5"

# Arrow / GeoParquet ecosystem
arrow = { version = "59", default-features = false, features = ["chrono-tz", "ipc"] }
parquet = { version = "59", default-features = false, features = ["arrow", "flate2", "flate2-rust_backened", "snap", "zstd"] }

# WKB / geometry decoding for input parsing
geozero = { version = "0.14", default-features = false, features = ["with-wkb", "with-geo"] }
arrow-schema = "59"
arrow-array = "59"

# Data I/O
csv = "1.3"

# Compression
flate2 = "1.0"

# Spatial indexing
hilbert_2d = "1.0"

# Cryptographic hashing
blake3 = "1.5"

# CRC32C integrity tag (SIMD-accelerated, replaces blake3 for v3 archives)
crc32c = "0.6"

# Parallel processing
rayon = "1.10"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"

# Time/Date
chrono = { version = "0.4", features = ["serde"] }

# I/O optimization
memmap2 = "0.9"
byteorder = "1.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

