[workspace]
# The four PUBLISHED crates, plus `stt-wasm` (publish = false — the wasm
# decoder, see docs/guides/wasm.md). The internal `stt-generate` generator lives
# at tools/stt-generate with its own `[workspace]` and lockfile — as a member it
# forced its dep tree's MSRV onto every crate here (see `rust-version` below).
members = [
  "crates/stt-core",
  "crates/stt-build",
  "crates/stt-optimize",
  "crates/spatiotemporal-tiles",
  "crates/stt-wasm",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Robert Christie"]
license = "MIT"
repository = "https://github.com/BertCh/spatiotemporal-tiles"
homepage = "https://github.com/BertCh/spatiotemporal-tiles"
# Empirically verified MSRV for the four PUBLISHED crates; enforced by the CI
# msrv job. Bisected with `cargo +<v> check -p stt-core -p stt-build
# -p stt-optimize -p spatiotemporal-tiles`:
#   1.82  — Cargo cannot even parse arrow-schema 59's manifest (edition 2024).
#   1.85/1.86 — `u64::is_multiple_of` (stt-build/src/input.rs) is still unstable.
#   1.87  — first version that compiles all four. ← this value
# It used to read 1.88 only because stt-generate was a workspace member and its
# home→osmpbf / delaunator deps demanded that; the generator now lives in its
# own workspace at tools/stt-generate and keeps its own 1.88 there.
rust-version = "1.87"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Geometry processing
geo = "0.28"
geo-types = "0.7"
geojson = { version = "0.24", features = ["geo-types"] }

# Polygon tessellation (pre-baked triangle indices, MLT-style)
earcutr = "0.5"

# Arrow / GeoParquet ecosystem
arrow = { version = "59", default-features = false, features = [
  "chrono-tz",
  "ipc",
] }
parquet = { version = "59", default-features = false, features = [
  "arrow",
  "flate2",
  "flate2-rust_backened",
  "snap",
  "zstd",
] }

# WKB / geometry decoding for input parsing
geozero = { version = "0.15", default-features = false, features = [
  "with-wkb",
  "with-geo",
] }
arrow-schema = "59"
arrow-array = "59"

# Spatial indexing
hilbert_2d = "1.0"

# Cryptographic hashing
blake3 = "1.5"

# CRC32C integrity tag (SIMD-accelerated, replaces blake3 for v3 archives)
crc32c = "0.6"

# Parallel processing
rayon = "1.10"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"

# Time/Date
chrono = { version = "0.4", features = ["serde"] }

# I/O optimization
memmap2 = "0.9"
byteorder = "1.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

